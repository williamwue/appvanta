name: AppVanta CI

on:
  push:
  pull_request:

jobs:
  portable-build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android Platform-Tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        timeout-minutes: 8
        with:
          cmdline-tools-version: '14742923' # 20.0; supports the portable OS matrix
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - name: Verify adb is runnable
        run: adb version
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Verify visual alignment through CLI and MCP
        run: node scripts/verify-visual-alignment.mjs
      - name: Verify Flow template CLI compilation
        run: node scripts/verify-flow-template.mjs
      - run: npm run verify:release-packages
      - name: Verify upgrade from public 0.1.0 snapshot
        timeout-minutes: 8
        run: npm run verify:upgrade
      - name: Test network recovery helpers
        working-directory: scripts
        run: python -m unittest test_proxy_recovery.py test_network_finalization.py
      - name: Stage run evidence only
        if: always()
        run: node scripts/stage-evidence.mjs .appvanta/runs .appvanta/ci-evidence
      - name: Upload AppVanta evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appvanta-evidence-${{ matrix.os }}
          path: .appvanta/ci-evidence/
          include-hidden-files: true
          if-no-files-found: ignore

  android-emulator:
    name: Android emulator smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm run build
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        timeout-minutes: 5
        env:
          ANDROID_HOME: ${{ runner.temp }}/appvanta-android-sdk
          ANDROID_SDK_ROOT: ${{ runner.temp }}/appvanta-android-sdk
        with:
          cmdline-tools-version: '15859902' # 22.0
          packages: ''
          log-accepted-android-sdk-licenses: 'false'
      - name: Install Android emulator image
        shell: bash
        timeout-minutes: 14
        run: |
          sdkmanager="$ANDROID_SDK_ROOT/cmdline-tools/22.0/bin/sdkmanager"
          avdmanager="$ANDROID_SDK_ROOT/cmdline-tools/22.0/bin/avdmanager"
          test -x "$sdkmanager" && test -x "$avdmanager"
          "$sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" "emulator" "platforms;android-35" "build-tools;35.0.0" \
            "system-images;android-35;google_apis;x86_64"
          printf 'no\n' | "$avdmanager" create avd --force --name appvanta-ci \
            --package "system-images;android-35;google_apis;x86_64" --device pixel_6
          test -x "$ANDROID_SDK_ROOT/platform-tools/adb"
          test -x "$ANDROID_SDK_ROOT/emulator/emulator"
      - name: Enable KVM acceleration
        shell: bash
        timeout-minutes: 1
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          "$ANDROID_SDK_ROOT/emulator/emulator" -accel-check
      - name: Start emulator
        shell: bash
        timeout-minutes: 7
        run: |
          adb="$ANDROID_SDK_ROOT/platform-tools/adb"
          nohup "$ANDROID_SDK_ROOT/emulator/emulator" -avd appvanta-ci -accel on -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > emulator.log 2>&1 &
          emulator_pid=$!
          if ! timeout 120s "$adb" wait-for-device; then
            echo "Emulator did not connect within 120 seconds"
            tail -n 80 emulator.log
            exit 1
          fi
          boot_deadline=$((SECONDS + 240))
          until [ "$(timeout 5s "$adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              echo "Emulator exited before boot completed"
              tail -n 80 emulator.log
              exit 1
            fi
            if (( SECONDS >= boot_deadline )); then
              echo "Emulator boot timed out after 240 seconds"
              tail -n 80 emulator.log
              exit 1
            fi
            sleep 2
          done
          timeout 15s "$adb" shell settings put global window_animation_scale 0
          timeout 15s "$adb" shell settings put global transition_animation_scale 0
          timeout 15s "$adb" shell settings put global animator_duration_scale 0
          "$adb" devices -l
      - name: Download pinned Markor APK
        shell: bash
        run: |
          mkdir -p test-apps
          curl --fail --location --retry 3 --output test-apps/markor.apk "https://github.com/gsantner/markor/releases/download/v2.16.1/net.gsantner.markor-v163-2.16.1-flavorDefault-release.apk"
          echo "e88cdcced7aa3dca25e6b9c7a9bdcfad3e3988ee545be951f42bf9441b5e46bf  test-apps/markor.apk" | sha256sum --check
      - name: Run Android smoke Flow
        shell: bash
        run: |
          node packages/cli/dist/index.js install emulator-5554 test-apps/markor.apk
          node packages/cli/dist/index.js run-flow emulator-5554 docs/examples/markor-ci-flow.json
      - name: Verify observed environment state
        timeout-minutes: 3
        run: node scripts/verify-environment-state.mjs emulator-5554
      - name: Verify compiled Flow template execution
        timeout-minutes: 3
        run: node scripts/verify-flow-template.mjs emulator-5554
      - name: Verify application process condition errors
        timeout-minutes: 2
        run: node scripts/verify-process-condition.mjs emulator-5554
      - name: Verify application accelerometer callbacks
        timeout-minutes: 4
        run: |
          python scripts/build-segment-clock.py --fixture sensor-probe
          node scripts/verify-sensor-events.mjs emulator-5554
          node scripts/verify-sensor-events.mjs emulator-5554 .appvanta/sensor-probe/appvanta-sensor-probe.apk y
          node scripts/verify-sensor-events.mjs emulator-5554 .appvanta/sensor-probe/appvanta-sensor-probe.apk z
          node scripts/verify-emulator-shake.mjs emulator-5554
      - name: Verify managed shake and owner crash recovery
        timeout-minutes: 4
        run: |
          node scripts/verify-shake-flow.mjs emulator-5554
          node scripts/verify-shake-action-cancel.mjs emulator-5554
      - name: Verify shake with disconnected ADB server transport
        timeout-minutes: 3
        run: node scripts/verify-shake-transport.mjs emulator-5554
      - name: Verify real device screenshot SSIM gate
        timeout-minutes: 3
        run: node scripts/verify-device-visual.mjs emulator-5554
      - name: Install network capture verifier dependencies
        timeout-minutes: 5
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/appvanta-proxy"
          "$RUNNER_TEMP/appvanta-proxy/bin/python" -m pip install -r scripts/network-requirements.txt
          echo "APPVANTA_MITMDUMP=$RUNNER_TEMP/appvanta-proxy/bin/mitmdump" >> "$GITHUB_ENV"
      - name: Verify interrupted screen pull recovery
        timeout-minutes: 4
        run: node scripts/verify-network-capture-recovery.mjs emulator-5554 tcp-pull-disconnect
      - name: Verify interrupted Perfetto pull recovery
        timeout-minutes: 4
        run: node scripts/verify-network-capture-recovery.mjs emulator-5554 tcp-pull-trace-disconnect
      - name: Verify sensor recovery after emulator shutdown
        timeout-minutes: 6
        run: node scripts/verify-shake-device-restart.mjs emulator-5554 appvanta-ci swiftshader_indirect
      - name: Stage device evidence
        if: always()
        run: node scripts/stage-evidence.mjs .appvanta/runs .appvanta/ci-evidence
      - name: Upload Android evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appvanta-android-emulator-evidence
          path: |
            .appvanta/ci-evidence/
            emulator.log
          include-hidden-files: true
          if-no-files-found: warn
